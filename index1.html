<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="product-list">
      <!-- Thẻ 1 -->
      <div class="product">
        <div class="image-box">
          <img src="https://png.pngtree.com/png-clipart/20240705/original/pngtree-fastfood-takeaway-junk-food-and-drinks-png-image_15492025.png" alt="Đồ ăn nhanh" />
        </div>
        <h2>Đồ ăn nhanh</h2>
        <p class="price">
          30.000-<br />100.000<br /><span class="currency">VNĐ</span>
        </p>
        <p class="description">Đồ ăn nhanh ngon, tiện lợi cho bữa ăn nhanh.</p>
        <button class="buy-button">Mua ngay</button>
      </div>

      <!-- Thẻ 2 -->
      <div class="product">
        <div class="image-box">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6UgpH4whvCg8pGouj3iO_NG60Q-LHPrHfhWInAReDdvO3B5_ka_sBLISo&s=10" alt="Nước uống" />
        </div>
        <h2>Nước uống</h2>
        <p class="price">
          15.000-<br />30.000<br /><span class="currency">VNĐ</span>
        </p>
        <p class="description">Nước uống giải khát ngon, giúp bổ sung năng lượng.</p>
        <button class="buy-button">Mua ngay</button>
      </div>

      <!-- Thẻ 3 -->
      <div class="product">
        <div class="image-box">
          <img src="image/a1.png" alt="Tráng miệng" />
        </div>
        <h2>Tráng miệng</h2>
        <p class="price">
          20.000-<br />50.000<br /><span class="currency">VNĐ</span>
        </p>
        <p class="description">Tráng miệng ngon, giúp hoàn thiện bữa ăn.</p>
        <button class="buy-button">Mua ngay</button>
      </div>
    </div>
  </body>
</html>
